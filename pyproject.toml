[project]
name = "stainstorm_orchestrator_jena"
version = "1.0.0"
description = "Arkitekt workflow orchestrator for the Jena staining setup (Fairino + Opentrons OT-2 + ImSwitch Microscope)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # The Arkitekt family moves together: one tested set for every stainSTORM app, bumped together.
    "arkitekt[rekuest,mikro]==19.0.1",
    "arkitekt-runtime==11.0.0",
    "arkitekt-spec==14.1.0",
    "rekuest==19.1.0",
    "mikro==15.0.0",
    "fakts==6.8.2",
    "pyyaml>=6",
]

[tool.uv]
package = false
